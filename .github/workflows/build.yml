name: Build & Release

on:
  push:
    branches: [1.21]
    tags: ['v*']
  pull_request:
    branches: [1.21]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v6.0.10), leave empty for branch build only'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals
          path: build/libs/*.jar
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: >
      (startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag != '' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: immersive-portals
          path: build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          files: build/libs/*.jar
          body_path: changelog.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
